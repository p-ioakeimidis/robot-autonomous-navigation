DWAPlannerROS:
  global_frame_id: odom

  ## Acceleration Limits
  acc_lim_x: 2.5
  acc_lim_y: 0.0 #2.5
  acc_lim_th: 3.2

  ## Velocity Limits
  max_vel_trans: 1.0 #0.55 #1.0
  min_vel_trans: 0.1

  max_vel_x: 1.0
  min_vel_x: 0.0 #0.1

  max_vel_y: 0.0 #1.0
  min_vel_y: 0.0

  max_vel_theta: 1.0
  min_vel_theta: 0.1 #0.4 #0.6 #0.4

  ## Goal Tolerance
  yaw_goal_tolerance: 0.2 #0.1
  xy_goal_tolerance: 0.2 #0.1
 
  latch_xy_goal_tolerance: false

  ## Forward Simulation
  sim_time: 3.0 #1.7
  sim_granularity: 0.025
  controller_frequency: 10.0 #20.0

  # vx_samples: 20
  # vth_samples: 40

  ## Trajectory Scoring Parameters
  path_distance_bias: 32.0 #24.0
  goal_distance_bias: 24.0 #32.0
  occdist_scale: 0.01
